name: ie-bank-infra

on:
  push:
    branches: [ "main", "develop" ]
    paths-ignore:
      - 'scripts/**'
      - '*.md'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  RESOURCE_GROUP_DEV: BCSAI2024-DEVOPS-PROFESSORS
  RESOURCE_GROUP_UAT: BCSAI2024-DEVOPS-PROFESSORS
  RESOURCE_GROUP_PROD: BCSAI2024-DEVOPS-PROFESSORS
  SUBSCRIPTION_ID_DEV: e0b9cada-61bc-4b5a-bd7a-52c606726b3b
  SUBSCRIPTION_ID_UAT: e0b9cada-61bc-4b5a-bd7a-52c606726b3b
  SUBSCRIPTION_ID_PROD: e0b9cada-61bc-4b5a-bd7a-52c606726b3b
  USER_ALIAS: aguadamillas

jobs:
  validate:
    name: 🔍 Validate & Lint
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔧 Setup Azure CLI
      uses: azure/CLI@v2
      with:
        azcliversion: latest

    - name: 🔍 Lint Bicep files
      run: |
        echo "🔍 Linting main.bicep..."
        az bicep build --file ./main.bicep
        
        echo "🔍 Linting modules..."
        for file in modules/*.bicep; do
          if [ -f "$file" ]; then
            echo "Linting $file..."
            az bicep build --file "$file"
          fi
        done

    - name: ✅ Validate Bicep syntax
      run: |
        echo "✅ Validating Bicep syntax..."
        az bicep build --file ./main.bicep --stdout > /dev/null

    - name: 📋 Check parameter files
      run: |
        echo "📋 Checking parameter files..."
        for env in dev uat prod; do
          if [ -f "parameters/${env}.parameters.json" ]; then
            echo "✅ Found parameters/${env}.parameters.json"
            # Validate JSON syntax
            cat "parameters/${env}.parameters.json" | jq . > /dev/null
          else
            echo "⚠️ Missing parameters/${env}.parameters.json"
          fi
        done

  deploy-dev:
    name: 🚀 Deploy to Development
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    environment:
      name: 'Development'

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🔐 Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: 🏗️ Deploy Infrastructure
      uses: azure/arm-deploy@v2
      with:
        subscriptionId: ${{ env.SUBSCRIPTION_ID_DEV }}
        resourceGroupName: ${{ env.RESOURCE_GROUP_DEV }}
        template: ./main.bicep
        parameters: >
          ./parameters/dev.parameters.json
          appServiceAPIEnvVarENV=${{ vars.ENV || 'dev' }}
          appServiceAPIEnvVarDBHOST=${{ vars.DBHOST }}
          appServiceAPIEnvVarDBNAME=${{ vars.DBNAME }}
          appServiceAPIEnvVarDBPASS=${{ secrets.DBPASS }}
          appServiceAPIDBHostDBUSER=${{ secrets.DBUSER }}
          appServiceAPIDBHostFLASK_APP=${{ vars.FLASK_APP || 'app.py' }}
          appServiceAPIDBHostFLASK_DEBUG=${{ vars.FLASK_DEBUG || '1' }}
        deploymentName: ${{ env.USER_ALIAS }}-dev-${{ github.run_number }}

    - name: ✅ Verify Deployment
      run: |
        echo "✅ Verifying development deployment..."

  deploy-uat:
    name: 🎭 Deploy to UAT
    runs-on: ubuntu-latest
    needs: [validate, deploy-dev]
    if: github.ref == 'refs/heads/main'
    environment:
      name: 'UAT'

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🔐 Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: 🏗️ Deploy Infrastructure
      uses: azure/arm-deploy@v2
      with:
        subscriptionId: ${{ env.SUBSCRIPTION_ID_UAT }}
        resourceGroupName: ${{ env.RESOURCE_GROUP_UAT }}
        template: ./main.bicep
        parameters: >
          ./parameters/uat.parameters.json
          appServiceAPIEnvVarENV=${{ vars.ENV_UAT || 'uat' }}
          appServiceAPIEnvVarDBHOST=${{ vars.DBHOST_UAT }}
          appServiceAPIEnvVarDBNAME=${{ vars.DBNAME_UAT }}
          appServiceAPIEnvVarDBPASS=${{ secrets.DBPASS_UAT }}
          appServiceAPIDBHostDBUSER=${{ secrets.DBUSER_UAT }}
          appServiceAPIDBHostFLASK_APP=${{ vars.FLASK_APP || 'app.py' }}
          appServiceAPIDBHostFLASK_DEBUG=${{ vars.FLASK_DEBUG_UAT || '0' }}
        deploymentName: ${{ env.USER_ALIAS }}-uat-${{ github.run_number }}

    - name: ✅ Verify Deployment
      run: |
        echo "✅ Verifying UAT deployment..."

  deploy-prod:
    name: 🌟 Deploy to Production
    runs-on: ubuntu-latest
    needs: [validate, deploy-uat]
    if: github.ref == 'refs/heads/main'
    environment:
      name: 'Production'

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🔐 Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: 🏗️ Deploy Infrastructure
      uses: azure/arm-deploy@v2
      with:
        subscriptionId: ${{ env.SUBSCRIPTION_ID_PROD }}
        resourceGroupName: ${{ env.RESOURCE_GROUP_PROD }}
        template: ./main.bicep
        parameters: >
          ./parameters/prod.parameters.json
          appServiceAPIEnvVarENV=${{ vars.ENV_PROD || 'prod' }}
          appServiceAPIEnvVarDBHOST=${{ vars.DBHOST_PROD }}
          appServiceAPIEnvVarDBNAME=${{ vars.DBNAME_PROD }}
          appServiceAPIEnvVarDBPASS=${{ secrets.DBPASS_PROD }}
          appServiceAPIDBHostDBUSER=${{ secrets.DBUSER_PROD }}
          appServiceAPIDBHostFLASK_APP=${{ vars.FLASK_APP || 'app.py' }}
          appServiceAPIDBHostFLASK_DEBUG=${{ vars.FLASK_DEBUG_PROD || '0' }}
        deploymentName: ${{ env.USER_ALIAS }}-prod-${{ github.run_number }}

    - name: ✅ Verify Deployment
      run: |
        echo "✅ Verifying production deployment..."

    - name: 🏷️ Create Infrastructure Tag
      if: success()
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git tag -a "infra-v$(date +'%Y.%m.%d')-${{ github.run_number }}" -m "Infrastructure production release $(date +'%Y.%m.%d')-${{ github.run_number }}"
        git push origin "infra-v$(date +'%Y.%m.%d')-${{ github.run_number }}"