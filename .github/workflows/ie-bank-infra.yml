name: ie-bank-infra

on:
  push:
    branches: [ "main", "develop" ]
    paths-ignore:
      - 'scripts/**'
      - '*.md'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  RESOURCE_GROUP_DEV: BCSAI2024-DEVOPS-PROFESSORS
  RESOURCE_GROUP_UAT: BCSAI2024-DEVOPS-PROFESSORS
  RESOURCE_GROUP_PROD: BCSAI2024-DEVOPS-PROFESSORS
  SUBSCRIPTION_ID_DEV: e0b9cada-61bc-4b5a-bd7a-52c606726b3b
  SUBSCRIPTION_ID_UAT: e0b9cada-61bc-4b5a-bd7a-52c606726b3b
  SUBSCRIPTION_ID_PROD: e0b9cada-61bc-4b5a-bd7a-52c606726b3b
  USER_ALIAS: aguadamillas

jobs:
  validate:
    name: 🔍 Validate & Lint
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔍 Lint Bicep files
      run: |
        echo "🔍 Linting main.bicep..."
        if [ -f "./main.bicep" ]; then
          az bicep build --file ./main.bicep
        else
          echo "⚠️ main.bicep not found, skipping lint"
        fi
        
        echo "🔍 Linting modules..."
        if [ -d "modules" ]; then
          for file in modules/*.bicep; do
            if [ -f "$file" ]; then
              echo "Linting $file..."
              az bicep build --file "$file"
            fi
          done
        else
          echo "⚠️ modules directory not found, skipping module lint"
        fi

    - name: ✅ Validate Bicep syntax
      run: |
        echo "✅ Validating Bicep syntax..."
        if [ -f "./main.bicep" ]; then
          az bicep build --file ./main.bicep --stdout > /dev/null
        else
          echo "⚠️ main.bicep not found, skipping validation"
        fi

    - name: 📋 Check parameter files
      run: |
        echo "📋 Checking parameter files..."
        for env in dev uat prod; do
          if [ -f "parameters/${env}.parameters.json" ]; then
            echo "✅ Found parameters/${env}.parameters.json"
            # Validate JSON syntax
            cat "parameters/${env}.parameters.json" | jq . > /dev/null
          else
            echo "⚠️ Missing parameters/${env}.parameters.json"
          fi
        done

  deploy-dev:
    name: 🚀 Deploy to Development
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    environment:
      name: 'Development'

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🔐 Azure Login (Simulated)
      run: |
        echo "🔐 Azure Login would happen here"
        echo "Note: AZURE_CREDENTIALS secret needs to be configured for actual deployment"
        echo "For now, we'll simulate the deployment process"

    - name: 🏗️ Deploy Infrastructure (Simulated)
      run: |
        echo "🏗️ Infrastructure deployment would happen here"
        echo "Subscription: ${{ env.SUBSCRIPTION_ID_DEV }}"
        echo "Resource Group: ${{ env.RESOURCE_GROUP_DEV }}"
        echo "User Alias: ${{ env.USER_ALIAS }}"
        echo "Deployment Name: ${{ env.USER_ALIAS }}-dev-${{ github.run_number }}"
        echo "✅ Simulated deployment successful"

    - name: ✅ Verify Deployment
      run: |
        echo "✅ Verifying development deployment..."
        echo "✅ All infrastructure components would be verified here"

  deploy-uat:
    name: 🎭 Deploy to UAT
    runs-on: ubuntu-latest
    needs: [validate, deploy-dev]
    if: github.ref == 'refs/heads/main'
    environment:
      name: 'UAT'

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🔐 Azure Login (Simulated)
      run: |
        echo "🔐 Azure Login would happen here"
        echo "Note: AZURE_CREDENTIALS secret needs to be configured for actual deployment"

    - name: 🏗️ Deploy Infrastructure (Simulated)
      run: |
        echo "🏗️ UAT Infrastructure deployment would happen here"
        echo "Subscription: ${{ env.SUBSCRIPTION_ID_UAT }}"
        echo "Resource Group: ${{ env.RESOURCE_GROUP_UAT }}"
        echo "✅ Simulated UAT deployment successful"

    - name: ✅ Verify Deployment
      run: |
        echo "✅ Verifying UAT deployment..."

  deploy-prod:
    name: 🌟 Deploy to Production
    runs-on: ubuntu-latest
    needs: [validate, deploy-uat]
    if: github.ref == 'refs/heads/main'
    environment:
      name: 'Production'

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🔐 Azure Login (Simulated)
      run: |
        echo "🔐 Azure Login would happen here"
        echo "Note: AZURE_CREDENTIALS secret needs to be configured for actual deployment"

    - name: 🏗️ Deploy Infrastructure (Simulated)
      run: |
        echo "🏗️ Production Infrastructure deployment would happen here"
        echo "Subscription: ${{ env.SUBSCRIPTION_ID_PROD }}"
        echo "Resource Group: ${{ env.RESOURCE_GROUP_PROD }}"
        echo "✅ Simulated Production deployment successful"

    - name: ✅ Verify Deployment
      run: |
        echo "✅ Verifying production deployment..."

    - name: 🏷️ Create Infrastructure Tag
      if: success()
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git tag -a "infra-v$(date +'%Y.%m.%d')-${{ github.run_number }}" -m "Infrastructure production release $(date +'%Y.%m.%d')-${{ github.run_number }}"
        echo "✅ Would push tag: infra-v$(date +'%Y.%m.%d')-${{ github.run_number }}"